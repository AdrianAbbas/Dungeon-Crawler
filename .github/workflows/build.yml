name: Native build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  JUCE_COMMIT: ea77444750de45e036e0279bb0291144bf8e3688 # JUCE 8.0.16, as in CMakeLists.txt
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      # The optional Developer ID path runs only when these secrets exist.
      HAS_DEVELOPER_ID: ${{ secrets.MACOS_CERTIFICATE != '' }}
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain and Rosetta
        run: |
          sw_vers
          xcodebuild -version
          cmake --version
          /usr/sbin/softwareupdate --install-rosetta --agree-to-license || true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The developer's recordings live in the private AdrianAbbas/Samples repository,
      # read with the SAMPLES_TOKEN secret, and are prepared for the instrument's sampler
      # here (tools/sample-prep, from WORLDBUILDER). They are never committed to this repository.
      # Without the secret the build goes on without them (a warning; the sampled
      # instruments play their synthesised stand-ins).
      - name: Fetch and prepare the samples (private repository)
        env:
          SAMPLES_TOKEN: ${{ secrets.SAMPLES_TOKEN }}
        run: bash scripts/ci-fetch-samples.sh "${{ runner.temp }}/samples-src" "${{ runner.temp }}/samples"
      # Session 13: the recorded brass, VSCO 2 Community Edition (CC0 1.0, docs/LICENSES),
      # fetched from its official source at a pinned commit (cached), its licence checked,
      # prepared into the same samples folder. Never committed to this repository.
      # Session 17: the woodwinds from the same library, pin and licence (a new cache key: the
      # checkout now holds the woodwind folders too).
      - name: Brass and woodwind library source cache (VSCO 2 CE, CC0)
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vsco-2-ce
          key: vsco-2-ce-440300901dfe9275fd84e0b7763af1f8443ae62e-woodwinds
      - name: Fetch and prepare the recorded brass and woodwinds (official source, CC0)
        run: bash scripts/ci-fetch-brass.sh "${{ runner.temp }}/vsco-2-ce" "${{ runner.temp }}/samples"
      # JUCE is fetched once and kept (the configure step otherwise clones its whole history).
      - name: JUCE source cache
        id: juce
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/juce
          key: juce-${{ env.JUCE_COMMIT }}
      - name: Fetch JUCE 8.0.16
        if: steps.juce.outputs.cache-hit != 'true'
        run: bash scripts/ci-fetch-juce.sh "${{ runner.temp }}/juce" "$JUCE_COMMIT"
      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: macos-universal
          max-size: 2G
      - name: Configure (universal arm64 + x86_64, macOS 10.15+)
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15
          -DJUCE_PATH="${{ runner.temp }}/juce" -DDC_SAMPLES_DIR="${{ runner.temp }}/samples"
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: |
          cmake --build build --parallel 4
          ccache --show-stats
      # The full processor suite runs in the Linux job. Here a short smoke group checks
      # each slice of the universal binary, and the cpu group reports (never fails on)
      # the cost of every location on this runner.
      - name: Smoke test and CPU report (arm64)
        run: /usr/bin/arch -arm64 build/DungeonCrawlerTests_artefacts/Release/DungeonCrawlerTests --only smoke,instrument,cpu,rename
      - name: Smoke test and CPU report (x86_64 under Rosetta)
        run: /usr/bin/arch -x86_64 build/DungeonCrawlerTests_artefacts/Release/DungeonCrawlerTests --only smoke,instrument,cpu,rename
      - name: Universal binary and Info.plist gate (instrument and effect)
        run: bash scripts/ci-check-bundles.sh build
      - name: Developer ID signing and notarisation (optional, untested)
        if: env.HAS_DEVELOPER_ID == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: bash scripts/ci-developer-id.sh build
      - name: Sign, verify and package (both plug-ins)
        run: bash scripts/package-mac.sh build dist
      - name: Build AU host harnesses (effect and instrument)
        run: bash scripts/build-au-harness.sh build/DungeonCrawlerAUHarness
      - name: Install a quarantined download with install-mac.sh, then auval and harnesses for both plug-ins (arm64 + x86_64)
        run: bash scripts/ci-user-install-test.sh dist/WindwardAudio-DungeonCrawler-macOS-Universal.zip build/DungeonCrawlerAUHarness build/ci-logs
      # Annotations are readable through the REST API; GitHub keeps at most 10 per step.
      - name: Publish install and arm64 harness logs as annotations
        if: always()
        run: bash scripts/ci-annotate.sh --condense build/ci-logs/quarantine.txt build/ci-logs/install-mac.txt build/ci-logs/harness-*-arm64-*.txt
      - name: Publish x86_64 harness and auval logs as annotations
        if: always()
        run: |
          for f in build/ci-logs/auval-*.txt; do
            if [[ -f "$f" ]]; then tail -25 "$f" > "$f.tail"; fi
          done
          bash scripts/ci-annotate.sh --condense build/ci-logs/harness-*-x86_64-*.txt build/ci-logs/control-*.txt build/ci-logs/crashes.txt build/ci-logs/auval-*.txt.tail
      - name: Upload installable package (only when every check passed)
        uses: actions/upload-artifact@v4
        with:
          name: WindwardAudio-DungeonCrawler-macOS-Universal
          path: dist/WindwardAudio-DungeonCrawler-macOS-Universal.zip
          if-no-files-found: error
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WindwardAudio-DungeonCrawler-macOS-diagnostics
          path: |
            build/ci-logs/
          if-no-files-found: warn
  linux:
    runs-on: ubuntu-24.04
    # Session 15: 90 (as the macOS job): the dungeon synth shard and render took the job past 60.
    # Session 18: 120: the job ran 66 minutes in Session 17; the dsmodern shard and render add about 10.
    timeout-minutes: 120
    env:
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The developer's recordings live in the private AdrianAbbas/Samples repository,
      # read with the SAMPLES_TOKEN secret, and are prepared for the instrument's sampler
      # here (tools/sample-prep, from WORLDBUILDER). They are never committed to this repository.
      # Without the secret the build goes on without them (a warning; the sampled
      # instruments play their synthesised stand-ins).
      - name: Fetch and prepare the samples (private repository)
        env:
          SAMPLES_TOKEN: ${{ secrets.SAMPLES_TOKEN }}
        run: bash scripts/ci-fetch-samples.sh "${{ runner.temp }}/samples-src" "${{ runner.temp }}/samples"
      # Session 13: the recorded brass, VSCO 2 Community Edition (CC0 1.0, docs/LICENSES),
      # fetched from its official source at a pinned commit (cached), its licence checked,
      # prepared into the same samples folder. Never committed to this repository.
      # Session 17: the woodwinds from the same library, pin and licence (a new cache key: the
      # checkout now holds the woodwind folders too).
      - name: Brass and woodwind library source cache (VSCO 2 CE, CC0)
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vsco-2-ce
          key: vsco-2-ce-440300901dfe9275fd84e0b7763af1f8443ae62e-woodwinds
      - name: Fetch and prepare the recorded brass and woodwinds (official source, CC0)
        run: bash scripts/ci-fetch-brass.sh "${{ runner.temp }}/vsco-2-ce" "${{ runner.temp }}/samples"
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libasound2-dev libfreetype6-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libgl1-mesa-dev
      - name: JUCE source cache
        id: juce
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/juce
          key: juce-${{ env.JUCE_COMMIT }}
      - name: Fetch JUCE 8.0.16
        if: steps.juce.outputs.cache-hit != 'true'
        run: bash scripts/ci-fetch-juce.sh "${{ runner.temp }}/juce" "$JUCE_COMMIT"
      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux
          max-size: 1G
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DJUCE_PATH="${{ runner.temp }}/juce" -DDC_SAMPLES_DIR="${{ runner.temp }}/samples"
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: |
          cmake --build build --parallel 4
          ccache --show-stats
      # The full processor suite as shards in parallel, then the CPU group alone
      # (report-only) so its timings are not disturbed.
      - name: Processor tests (full suite)
        run: bash scripts/run-tests-parallel.sh build/DungeonCrawlerTests_artefacts/Release/DungeonCrawlerTests build/test-logs
      # The same guitar and synth phrase dry, then through each place (one A/B file per
      # place), strength.csv, and a journey through every place, in the test-logs artifact.
      - name: Listening renders (dry vs processed per place, WAV)
        if: always()
        run: build/DungeonCrawlerTests_artefacts/Release/DungeonCrawlerTests --listen build/test-logs/listening
      # The same melody on every instrument, dry and then in its place (Direction Update 3).
      - name: Listening renders (one melody on every instrument, WAV)
        if: always()
        run: build/DungeonCrawlerTests_artefacts/Release/DungeonCrawlerTests --listen-instruments build/test-logs/instruments
      # Session 8: melody and chords on every instrument with the new recordings (dry, in its
      # place, then its stand-in), and the FX's voice places before vs after, as WAV.
      - name: Listening renders (the new recordings, WAV)
        if: always()
        run: build/DungeonCrawlerTests_artefacts/Release/DungeonCrawlerTests --listen-recordings build/test-logs/recordings
      # Session 11: a four-instrument mini-song (brass, strings, choir, drums) before and after
      # the new mix defaults, and the brass with Punch 0 against its own Punch, as WAV.
      - name: Listening renders (mini-song before and after, brass Punch, WAV)
        if: always()
        run: build/DungeonCrawlerTests_artefacts/Release/DungeonCrawlerTests --listen-mix build/test-logs/mix
      # Session 12: every horn and brass (Tower Top, Great Hall, Final Boss Lair, Dwarven Hall)
      # playing one horn phrase, Session 11 then 12, dry and in its place, as WAV; next to them
      # LIGHT SEEKER's Fanfare Trumpets and Heroic Horns with the same phrase (Tests/reference,
      # rendered by tools/brass-reference) and the brass report.
      - name: Listening renders (horns and brass before and after, LIGHT SEEKER reference)
        if: always()
        run: |
          build/DungeonCrawlerTests_artefacts/Release/DungeonCrawlerTests --listen-brass build/test-logs/brass
          cp Tests/reference/brass/* build/test-logs/brass/
          build/DungeonCrawlerTests_artefacts/Release/DungeonCrawlerTests --brass-report > build/test-logs/brass/brass-report.txt
      # Session 13: every brass instrument (Tower Top horn, Great Hall fanfare, Final Boss Lair
      # doom brass, Dwarven Hall low brass, Hoard Gong growl) playing the horn phrase before
      # (sound 12, the synthesis) and after (sound 13, the recorded brass), dry and in its place,
      # as WAV, and the numbers behind the checks.
      - name: Listening renders (recorded brass before and after, dry and in its place)
        if: always()
        run: |
          build/DungeonCrawlerTests_artefacts/Release/DungeonCrawlerTests --listen-realbrass build/test-logs/realbrass
          build/DungeonCrawlerTests_artefacts/Release/DungeonCrawlerTests --realbrass-report > build/test-logs/realbrass/realbrass-report.txt || true
          cp "${{ runner.temp }}/samples.brass.log" build/test-logs/realbrass/brass-prep.txt || true
      # Session 14: the brass (Tower Top horn, Great Hall fanfare, Final Boss Lair doom brass,
      # Dwarven Hall low brass, Hoard Gong growl) and the War Drums before (sound 13) and after
      # (sound 14, seated), alone dry and in its place, and a short mix with choir and strings.
      - name: Listening renders (brass and war drums seated, before and after, WAV)
        if: always()
        run: |
          build/DungeonCrawlerTests_artefacts/Release/DungeonCrawlerTests --listen-seat build/test-logs/seat
          build/DungeonCrawlerTests_artefacts/Release/DungeonCrawlerTests --seat-report > build/test-logs/seat/seat-report.txt || true
      # Session 15: DUNGEON SYNTH. The dark fantasy test melody on five instruments in their places
      # (Royal Strings, Dark Choir Pad, Chamber Organ, Wooden Flute, Lute) at 0 %, Classic 50 and
      # 100 %, Modern 50 and 100 %, one WAV each; the FX's material through the Crypt and the Gates
      # the same way in one file each; and the numbers behind the checks.
      # Session 16: an A/B file per instrument (0 %, Classic 100 %, Modern 100 %), the strength
      # numbers and the audit (what of the stage reaches the output).
      - name: Listening renders (dungeon synth, Classic and Modern, 0 / 50 / 100 %, WAV)
        if: always()
        run: |
          build/DungeonCrawlerTests_artefacts/Release/DungeonCrawlerTests --listen-dungeonsynth build/test-logs/dungeonsynth
          build/DungeonCrawlerTests_artefacts/Release/DungeonCrawlerTests --ds-report > build/test-logs/dungeonsynth/dungeonsynth-report.txt || true
          build/DungeonCrawlerTests_artefacts/Release/DungeonCrawlerTests --ds-strength > build/test-logs/dungeonsynth/dungeonsynth-strength.txt || true
          build/DungeonCrawlerTests_artefacts/Release/DungeonCrawlerTests --ds-audit > build/test-logs/dungeonsynth/dungeonsynth-audit.txt || true
      # Session 18: DUNGEON SYNTH Modern rebuilt as a lush, warm vintage sampler. The dark fantasy
      # melody on five instruments in their places, Modern 100 % before (Session 17) and after, an
      # A/B file each (0 %, before, after), after at 25 and 50 %, and the numbers.
      - name: Listening renders (dungeon synth Modern before and after, WAV)
        if: always()
        run: |
          build/DungeonCrawlerTests_artefacts/Release/DungeonCrawlerTests --listen-dsmodern build/test-logs/dsmodern
          build/DungeonCrawlerTests_artefacts/Release/DungeonCrawlerTests --ds-modern > build/test-logs/dsmodern/dsmodern-report.txt || true
      # Session 17: the woodwinds (Village Green tin whistle, Forest Edge wooden flute, Foothills
      # shepherd's flute, Bog murky reed) playing a woodwind phrase before (sound 14, the
      # synthesis) and after (sound 15, the recorded woodwinds), dry and in its place, an
      # Expression swell each, and the numbers behind the checks (the cents report).
      - name: Listening renders (recorded woodwinds before and after, dry and in its place)
        if: always()
        run: |
          build/DungeonCrawlerTests_artefacts/Release/DungeonCrawlerTests --listen-realwinds build/test-logs/realwinds
          build/DungeonCrawlerTests_artefacts/Release/DungeonCrawlerTests --realwinds-report > build/test-logs/realwinds/realwinds-report.txt || true
          cp "${{ runner.temp }}/samples.woodwinds.log" build/test-logs/realwinds/woodwinds-prep.txt || true
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WindwardAudio-DungeonCrawler-linux-test-logs
          path: build/test-logs/
          if-no-files-found: warn
  release:
    # Tagged commits (v*) publish the same package as a GitHub Release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: WindwardAudio-DungeonCrawler-macOS-Universal
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" WindwardAudio-DungeonCrawler-macOS-Universal.zip --repo "$GITHUB_REPOSITORY" --title "DUNGEON CRAWLER $GITHUB_REF_NAME" --generate-notes
